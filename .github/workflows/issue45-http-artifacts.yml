name: Issue 45 official HTTP artifact verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/issue45-runtime/verify*http_artifacts.py'
      - 'diagnostics/issue45-runtime/HTTP-ARTIFACT-VERIFICATION.md'
      - 'tests/test_issue45_http*.py'
      - 'docs/dependency-evidence/issue45-netty-lz4-high-2026-11-23/minecraft-version-manifests/**'
      - '.github/workflows/issue45-http-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'diagnostics/issue45-runtime/verify*http_artifacts.py'
      - 'diagnostics/issue45-runtime/HTTP-ARTIFACT-VERIFICATION.md'
      - 'tests/test_issue45_http*.py'
      - 'docs/dependency-evidence/issue45-netty-lz4-high-2026-11-23/minecraft-version-manifests/**'
      - '.github/workflows/issue45-http-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-http:
    name: Verify official HTTP artifacts with offline CLI
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Acquire and verify three official HTTP codec JARs
        run: python diagnostics/issue45-runtime/verify_official_http_artifacts.py --output "${{ runner.temp }}/issue45-http-observation-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Retain only the static HTTP artifact report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue45-http-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue45-http-observation-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
