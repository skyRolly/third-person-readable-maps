name: Gradle credential guard regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Verify Gradle credential guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.9.2'
          cache-provider: basic
          cache-read-only: true
      - name: Exercise guard with synthetic credentials
        run: python scripts/check_gradle_credential_guard.py
      - name: Verify live audit evidence
        run: python -m unittest discover -s tests -p "test_issue45_live_audits.py" -v
      - name: Verify packaged-mod evidence
        run: python -m unittest discover -s tests -p "test_issue45_mod_jar_inspection.py" -v
      - name: Verify focused review applicability
        run: python -m unittest discover -s tests -p "test_issue45_review_applicability.py" -v
      - name: Verify historical build continuity
        run: python -m unittest discover -s tests -p "test_issue45_build_continuity.py" -v
      - name: Verify High Netty SNI evidence
        run: python -m unittest discover -s tests -p "test_issue45_sni_high.py" -v
      - name: Verify offline SNI cache CLI regressions
        run: python -m unittest discover -s tests -p "test_issue45_sni_cache_cli.py" -v
      - name: Verify High Netty IP-filter evidence
        run: python -m unittest discover -s tests -p "test_issue45_netty_ipfilter_high.py" -v
      - name: Verify High Netty IP-filter library bytes
        run: python scripts/inspect_issue45_netty_ipfilter_high.py --verify-known-download
      - name: Verify High Netty Bzip2 evidence
        run: python -m unittest discover -s tests -p "test_issue45_netty_bzip2_high.py" -v
      - name: Set up JDK for Minecraft pipeline disassembly
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Verify Bzip2 codec and Minecraft client artifact bytes and disassembly
        run: python scripts/inspect_issue45_netty_bzip2_high.py --verify-codec-download --verify-client-download --javap javap
      - name: Verify High Netty Trust Manager evidence
        run: python -m unittest discover -s tests -p "test_issue45_netty_trust_high.py" -v
      - name: Verify Trust Manager handler bytes and representative client disassembly
        run: python scripts/inspect_issue45_netty_trust_high.py --verify-known-download --verify-management-download --verify-fixed-download --javap javap
      - name: Verify High Netty Lz4FrameDecoder evidence
        run: python -m unittest discover -s tests -p "test_issue45_netty_lz4_high.py" -v
      - name: Validate retained Netty Lz4FrameDecoder review
        run: python scripts/inspect_issue45_netty_lz4_high.py
      - name: Acquire pinned Netty JARs for offline cache verification
        run: python scripts/prepare_issue45_sni_cache.py --output "${{ runner.temp }}/issue45-sni-cache-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify known SNI class hits from the offline cache
        run: python scripts/inspect_issue45_sni_high.py --verify-known-hits-cache "${{ runner.temp }}/issue45-sni-cache-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Remove temporary Netty cache
        if: always()
        run: python -c "from pathlib import Path; import shutil, sys; p = Path(sys.argv[1]); shutil.rmtree(p) if p.exists() else None" "${{ runner.temp }}/issue45-sni-cache-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Exercise Issue 45 diagnostic privacy and populated snapshots on Java 21
        run: python diagnostics/issue45-runtime/run_controls.py --work-dir "${{ runner.temp }}/issue45-agent-j21" --fresh-evidence-dir "${{ runner.temp }}/issue45-evidence-j21"
      # Keep native commands in separate steps: PowerShell otherwise reports
      # the last Python process's exit status, masking earlier failures.
      - name: Validate regenerated Java 21 runtime archive
        run: python diagnostics/issue45-runtime/validate_runtime_evidence.py --evidence-dir "${{ runner.temp }}/issue45-evidence-j21" --expected-synthetic-java-major 21
      - name: Test Java 21 runtime evidence and privacy regressions
        run: python -m unittest discover -s tests -p "test_issue45_runtime_pipeline_evidence.py" -v
      - name: Test Java 21 Netty erratum mutation regressions
        run: python -m unittest discover -s tests -p "test_issue45_netty_compatibility_focus.py" -v
      - name: Collect Java 21 compiled build identity
        run: python diagnostics/issue45-runtime/build_identity.py collect --work-dir "${{ runner.temp }}/issue45-agent-j21" --java-major 21 --os "${{ matrix.os }}" --output "${{ runner.temp }}/issue45-compiled-identity-${{ github.run_id }}-${{ github.run_attempt }}/identity-j21.json"
      - name: Switch diagnostic controls to Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Exercise Issue 45 diagnostic class transformations on Java 25
        run: python diagnostics/issue45-runtime/run_controls.py --work-dir "${{ runner.temp }}/issue45-agent-café-j25" --fresh-evidence-dir "${{ runner.temp }}/issue45-evidence-j25"
      - name: Validate regenerated Java 25 runtime archive
        run: python diagnostics/issue45-runtime/validate_runtime_evidence.py --evidence-dir "${{ runner.temp }}/issue45-evidence-j25" --expected-synthetic-java-major 25
      - name: Test Java 25 runtime evidence and privacy regressions
        run: python -m unittest discover -s tests -p "test_issue45_runtime_pipeline_evidence.py" -v
      - name: Test Java 25 Netty erratum mutation regressions
        run: python -m unittest discover -s tests -p "test_issue45_netty_compatibility_focus.py" -v
      - name: Collect Java 25 compiled build identity
        run: python diagnostics/issue45-runtime/build_identity.py collect --work-dir "${{ runner.temp }}/issue45-agent-café-j25" --java-major 25 --os "${{ matrix.os }}" --output "${{ runner.temp }}/issue45-compiled-identity-${{ github.run_id }}-${{ github.run_attempt }}/identity-j25.json"
      - name: Upload compiled build identities only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue45-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/issue45-compiled-identity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
  compare-builds:
    name: Compare compiled diagnostic identities
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Download this attempt's compiled identity reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: issue45-build-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/issue45-build-reports
          merge-multiple: false
      - name: Require complete equal compiled artifact matrix
        run: python diagnostics/issue45-runtime/build_identity.py compare --reports "${{ runner.temp }}/issue45-build-reports"
      # Check the documented minimum without changing the historical
      # reachability workflow whose exact bytes are pinned as evidence.
      - name: Set up diagnostic minimum Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10.22'
      - name: Test compiled build identity on Python 3.10
        run: python3 -m unittest discover -s tests -p "test_issue45_build_identity.py" -v
