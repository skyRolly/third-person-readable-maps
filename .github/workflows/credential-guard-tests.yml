name: Gradle credential guard regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Verify Gradle credential guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.9.2'
          cache-provider: basic
          cache-read-only: true
      - name: Exercise guard with synthetic credentials
        run: python scripts/check_gradle_credential_guard.py
      - name: Verify live audit evidence
        run: python -m unittest discover -s tests -p "test_issue45_live_audits.py" -v
      - name: Verify packaged-mod evidence
        run: python -m unittest discover -s tests -p "test_issue45_mod_jar_inspection.py" -v
      - name: Verify focused review applicability
        run: python -m unittest discover -s tests -p "test_issue45_review_applicability.py" -v
      - name: Verify historical build continuity
        run: python -m unittest discover -s tests -p "test_issue45_build_continuity.py" -v
      - name: Verify High Netty SNI evidence
        run: python -m unittest discover -s tests -p "test_issue45_sni_high.py" -v
      - name: Verify High Netty IP-filter evidence
        run: python -m unittest discover -s tests -p "test_issue45_netty_ipfilter_high.py" -v
