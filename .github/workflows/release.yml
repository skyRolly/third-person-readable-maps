name: Coordinated release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run, prepare a reviewed draft, or publish an already reviewed draft
        type: choice
        options: [dry-run, prepare-draft, publish]
        required: true
        default: dry-run

permissions:
  contents: read

concurrency:
  group: coordinated-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Validate plan and construct matrix
        id: plan
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = dry-run ]; then
            python3 scripts/release.py validate --plan release/plan.json --candidate
            python3 scripts/release.py verify-sources --plan release/plan.json --candidate
            matrix=$(python3 scripts/release.py matrix --plan release/plan.json --candidate)
          else
            test "$GITHUB_REF" = refs/heads/main
            python3 scripts/release.py validate --plan release/plan.json
            python3 scripts/release.py verify-sources --plan release/plan.json
            matrix=$(python3 scripts/release.py matrix --plan release/plan.json)
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Check source and environment approval before building
        if: inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUDITOR_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = publish ]; then environment=release-publication; else environment=release-draft; fi
          python3 scripts/authorize_release.py --plan release/plan.json --coordinator-sha "$GITHUB_SHA" --environment "$environment"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Clean build and verify
        run: ./gradlew --no-daemon --console=plain --stacktrace --warning-mode=fail clean build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.multi_version
        with:
          python-version: '3.15.2'
      - name: Verify every advertised Minecraft version
        if: matrix.multi_version
        run: python3 scripts/verify_supported_apis.py --jar build/libs
      - name: Upload group artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.group }}
          path: build/libs/*-mc${{ matrix.group }}.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.group }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Validate and aggregate artifacts
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = dry-run ]; then
            python3 scripts/release.py aggregate --plan release/plan.json --artifacts artifacts --output bundle --candidate --coordinator-sha "$GITHUB_SHA"
          else
            python3 scripts/release.py aggregate --plan release/plan.json --artifacts artifacts --output bundle --coordinator-sha "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.mode == 'publish' && 'release-publication' || 'release-draft' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: bundle
      - name: Recheck source and environment authorization
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUDITOR_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = publish ]; then environment=release-publication; else environment=release-draft; fi
          python3 scripts/authorize_release.py --plan release/plan.json --coordinator-sha "$GITHUB_SHA" --environment "$environment"
      - name: Prepare or publish the exact verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUDITOR_TOKEN: ${{ secrets.RELEASE_AUDITOR_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/release_github.py "$MODE" --plan release/plan.json --bundle bundle --coordinator-sha "$GITHUB_SHA"
