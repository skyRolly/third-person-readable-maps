name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'coordination/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordination:
    name: Validate coordination
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Test release and coordination controls
        run: python3 -m unittest discover -s tests -v
      - name: Check current evidence and actual shared verifier copies
        run: |
          python3 scripts/validate_current_evidence.py
          python3 scripts/check_shared_verifier_sync.py --fetch-missing
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Verify active maintenance targets against their branches
        run: python3 scripts/validate_maintenance_targets.py --verify-remote

  live-release-prerequisites:
    name: Validate live release prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Verify live source version and required verification tools
        run: python3 scripts/validate_maintenance_targets.py --verify-remote --require-release-verifiers

  reachability-experiments:
    name: Verify reachability experiments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Validate source-bound Issue #45 observations
        run: python scripts/validate_critical_reachability_evidence.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Check local-only Log4j, Netty, and LZ4 behavior
        run: python scripts/probe_dependency_reachability.py --cache .probe-cache --download --output reachability-probes.json
      - name: Check Commons Compress TAR behavior against the upstream fix
        run: python scripts/probe_commons_compress_reachability.py --cache .probe-cache --download --output commons-compress-reachability.json
      - name: Probe Log4j on exact Mojang-selected Java runtimes
        run: python scripts/probe_mojang_log4j_runtime_matrix.py --cache .probe-cache/mojang-log4j --output mojang-log4j-runtime-probes.json
      - name: Validate exact Mojang Log4j runtime evidence
        run: python scripts/validate_mojang_log4j_runtime_probes.py --report mojang-log4j-runtime-probes.json --expected-analysis-commit "${{ github.sha }}"
      - name: Retain experiment results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reachability-probes-${{ matrix.os }}
          path: reachability-probes.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain Commons Compress probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commons-compress-probe-${{ matrix.os }}
          path: commons-compress-reachability.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact Mojang Log4j runtime probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mojang-log4j-runtime-probes-${{ matrix.os }}
          path: |
            mojang-log4j-runtime-probes.json
            docs/dependency-evidence/critical-reachability-2026-11-21/log4j-mojang-runtime-2026-11-22/metadata/
          if-no-files-found: error
          retention-days: 30
