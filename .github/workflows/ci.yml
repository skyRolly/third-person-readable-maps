name: CI

on:
  pull_request:
    branches: ['mc/1.21.11']
  push:
    branches: ['mc/1.21.11']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Verify Gradle wrapper checksums
        run: python scripts/verify_gradle_wrapper.py
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/mc/1.21.11' }}
      - name: Clean build and verify mod (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --console=plain --stacktrace --warning-mode=all clean build
      - name: Clean build through Windows entry point
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\Build-Windows.bat" --stacktrace --warning-mode=all'
      - name: Test static verification
        run: python -m unittest discover -s tests
      - name: Verify packaged game and library APIs
        run: python scripts/verify_supported_apis.py --jar build/libs
      - name: Upload distributable mod
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-person-readable-maps-${{ runner.os }}
          path: build/libs/*-mc1.21.11.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            build/reports/
            build/test-results/
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  dependency-graph:
    name: Resolve and inspect dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Verify Gradle wrapper checksums
        run: python scripts/verify_gradle_wrapper.py
      # Retain a per-commit inspection artifact; this does not submit to GitHub.
      # Central OSV auditing complements default-branch Dependabot security alerts.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
          dependency-graph: generate-and-upload
          additional-arguments: --no-daemon --console=plain --stacktrace
          artifact-retention-days: 14
