name: Maintenance dependency audit

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [mc/1.21.11, mc/26.1-26.2, mc/26.3]
    steps:
      - name: Checkout coordination tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          path: source
          persist-credentials: false
      - name: Record checked-out source commit
        id: source
        run: printf 'sha=%s\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Verify source Wrapper using coordination policy
        run: python3 scripts/verify_gradle_wrapper.py --root source
      - name: Generate read-only Gradle dependency snapshot
        env:
          GITHUB_DEPENDENCY_GRAPH_REF: refs/heads/${{ matrix.branch }}
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ steps.source.outputs.sha }}
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: source
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
          dependency-graph: generate-and-upload
          # Generation/upload needs no GitHub API token. Do not pass the action's
          # default token through to the Gradle subprocess via its input environment.
          github-token: ''
          # Re-resolve cached Loom mappings so the detector observes intermediary too.
          additional-arguments: --no-daemon --console=plain --stacktrace --refresh-dependencies --init-script ${{ github.workspace }}/.github/gradle/no-github-credentials.init.gradle
          artifact-retention-days: 14
      - name: Query OSV for snapshot packages
        env:
          BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          snapshots=(dependency-graph-reports/*.json)
          test "${#snapshots[@]}" -eq 1
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/audit_dependencies.py --snapshot "${snapshots[0]}" --branch "$BRANCH" --source-sha "$SOURCE_SHA" --output dependency-audit.json
      - name: Query upstream Gradle build-tool advisories
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/audit_gradle_tool.py --root source --source-sha "$SOURCE_SHA" --output gradle-tool-audit.json
      - name: Export audit evidence to job log for recovery
        if: always()
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, json
          from pathlib import Path
          files = [Path('dependency-audit.json'), Path('gradle-tool-audit.json'), *Path('dependency-graph-reports').glob('*.json')]
          payload = {p.name: json.loads(p.read_text()) for p in files if p.is_file()}
          data = base64.b64encode(gzip.compress(json.dumps(payload, separators=(',', ':')).encode(), mtime=0)).decode()
          for i in range(0, len(data), 2000):
              print('ISSUE45_EVIDENCE_V1:' + data[i:i+2000])
          PYCODE
      - name: Summarize audit status
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("dependency-audit.json")
          print("## Dependency audit: " + os.environ["BRANCH"])
          if not p.exists():
              print("INCOMPLETE: snapshot generation or audit did not complete. Inspect failed steps.")
          else:
              r = json.loads(p.read_text())
              print("Source: `" + r["source_sha"] + "`; scan: **" + r["status"] + "**")
              if r["status"] == "incomplete":
                  print("See the retained report for the validation/API error.")
              else:
                  for state in ("new", "changed", "known"):
                      print(state + ": " + str(sum(m["state"] == state for m in r["matches"])))
                  print("Reviewed resolved: " + str(len(r["resolved"])))
                  print("Disappeared and needing review: " + str(len(r["resolved_needing_review"])))
                  print("Unresolved/failing current matches: " + str(sum(m["failing"] for m in r["matches"])))
                  print("Known findings remain visible in the full artifact; this is not release approval.")
          q = Path("gradle-tool-audit.json")
          if not q.exists():
              print("Gradle upstream advisory check: INCOMPLETE; no report was produced.")
          else:
              tool = json.loads(q.read_text())
              if tool['status'] != 'complete':
                  print("Gradle upstream advisory check: INCOMPLETE; see retained report.")
              else:
                  print("Gradle " + tool['gradle_version'] + " upstream advisory matches: " + str(len(tool['advisories'])))
          PYTHON
      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ strategy.job-index }}
          path: |
            dependency-audit.json
            gradle-tool-audit.json
          if-no-files-found: warn
          retention-days: 30

  recover:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: diagnostic/issue-45-audit-export
      - name: Download completed audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44940017926 --dir "$RUNNER_TEMP/candidate"
          gh run download 44940018290 --dir "$RUNNER_TEMP/integrated"
      - name: Preserve the original reports and snapshots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          out = Path('docs/dependency-evidence/issue45-exact-source-2026-11-21-v2')
          out.mkdir(parents=True)
          index = {'schema': 1, 'coordination_sha': '01ba93db13d977e3bb0bf3400a6e373d35ff14e7',
                   'candidate_run': 44940017926, 'integrated_run': 44940018290, 'files': []}
          try:
              for kind in ('candidate', 'integrated'):
                  for path in sorted((root / kind).rglob('*.json')):
                      if not path.is_file():
                          continue
                      raw = path.read_bytes()
                      data = json.loads(raw)
                      # Store the raw bytes, including formatting; no old files are modified.
                      target = out / kind / path.parent.name / (path.name + '.gz')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(gzip.compress(raw, mtime=0))
                      index['files'].append({'path': str(target), 'sha256_uncompressed': hashlib.sha256(raw).hexdigest(),
                                             'sha256_gzip': hashlib.sha256(target.read_bytes()).hexdigest(),
                                             'source_sha': data.get('source_sha', data.get('sha')),
                                             'status': data.get('status')})
              assert sum(x['path'].endswith('/candidate-dependency-audit.json.gz') for x in index['files']) == 10
              assert sum(x['path'].endswith('/dependency-audit.json.gz') for x in index['files']) == 3
              (out / 'archive-index.json').write_text(json.dumps(index, indent=2) + '\n')
          except Exception:
              import traceback
              (out / 'ERROR.txt').write_text(traceback.format_exc() + '\n' + '\n'.join(str(p) for p in root.rglob('*.json')))
          PY
      - name: Commit evidence to its own branch
        run: |
          set -euo pipefail
          git switch -c evidence/issue45-exact-source-2026-11-21-v3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/dependency-evidence/issue45-exact-source-2026-11-21-v2
          git commit -m 'Preserve exact-source Issue 45 audit artifacts'
          git push origin evidence/issue45-exact-source-2026-11-21-v3
