name: Maintenance dependency audit

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [mc/1.21.11, mc/26.1-26.2, mc/26.3]
    steps:
      - name: Checkout coordination tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          path: source
          persist-credentials: false
      - name: Record checked-out source commit
        id: source
        run: printf 'sha=%s\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Generate read-only Gradle dependency snapshot
        env:
          GITHUB_DEPENDENCY_GRAPH_REF: refs/heads/${{ matrix.branch }}
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ steps.source.outputs.sha }}
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: source
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
          dependency-graph: generate-and-upload
          additional-arguments: --no-daemon --console=plain --stacktrace
          artifact-retention-days: 14
      - name: Query OSV for snapshot packages
        env:
          BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          snapshots=(dependency-graph-reports/*.json)
          test "${#snapshots[@]}" -eq 1
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/scan_dependency_snapshot.py --snapshot "${snapshots[0]}" --branch "$BRANCH" --source-sha "$SOURCE_SHA" --output dependency-audit.json
      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ strategy.job-index }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
