plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

def resourceProperties = [version: project.version.toString(), minecraft_version: project.minecraft_version,
                          loader_version: project.loader_version]
processResources {
    inputs.properties resourceProperties
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:unchecked')
}

java {
    // Compile with the same JDK as Gradle, but enforce Java 8's APIs and bytecode above.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('remapJar') {
    archiveClassifier = "mc${project.minecraft_group}"
}

jar {
    from('LICENSE')
}

apply from: 'gradle/verification.gradle'
