import groovy.json.JsonSlurper
import java.util.jar.JarFile
import java.util.zip.ZipFile
import org.objectweb.asm.ClassReader
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type
import org.objectweb.asm.tree.ClassNode

buildscript {
    dependencies {
        classpath files(project.buildscript.configurations.classpath)
    }
}

// Use Loom's existing ASM dependency to inspect bytecode without starting Minecraft.
def readClass = { byte[] bytes ->
    def node = new ClassNode()
    new ClassReader(bytes).accept(node, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
    node
}
def annotationValues = { annotation ->
    if (annotation == null) throw new GradleException('Required Mixin annotation is missing')
    annotation.values.collate(2).collectEntries { [(it[0]): it[1]] }
}
def annotations = { node -> (node.visibleAnnotations ?: []) + (node.invisibleAnnotations ?: []) }
def require = { boolean condition, String message ->
    if (!condition) throw new GradleException(message)
}
def mixinClassPath = 'tech/rolly/thirdpersonreadablemaps/mixin/ReadableMapLayerMixin.class'
def compiledClasses = sourceSets.main.output.classesDirs
def minecraftClasspath = configurations.compileClasspath
def modVersion = project.version.toString()
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version

tasks.register('verifyMixinTarget') {
    group = 'verification'
    description = 'Checks the injection handler against the actual Minecraft method signature.'
    dependsOn tasks.named('classes')
    inputs.files(compiledClasses, minecraftClasspath)
    def report = layout.buildDirectory.file('reports/verification/mixin-target.txt')
    outputs.file(report)
    doLast {
        def mixinFile = compiledClasses.files.collect { new File(it, mixinClassPath) }.find { it.isFile() }
        require(mixinFile != null, 'Compiled map Mixin is missing')
        def mixin = readClass(mixinFile.bytes)
        def target = annotationValues(annotations(mixin).find { it.desc == 'Lorg/spongepowered/asm/mixin/Mixin;' }).value[0].internalName
        def handler = mixin.methods.find { method -> annotations(method).any { it.desc == 'Lorg/spongepowered/asm/mixin/injection/Inject;' } }
        require(handler != null, 'Map injection handler is missing')
        def inject = annotationValues(annotations(handler).find { it.desc == 'Lorg/spongepowered/asm/mixin/injection/Inject;' })
        def arguments = Type.getArgumentTypes(handler.desc).toList()
        require(arguments.last().descriptor == 'Lorg/spongepowered/asm/mixin/injection/callback/CallbackInfo;', 'Unexpected Mixin callback type')
        def descriptor = Type.getMethodDescriptor(Type.VOID_TYPE, arguments.dropRight(1) as Type[])
        def targetBytes = minecraftClasspath.files.findResult { file ->
            if (!file.name.endsWith('.jar')) return null
            new ZipFile(file).withCloseable { zip ->
                def entry = zip.getEntry("${target}.class")
                entry == null ? null : zip.getInputStream(entry).bytes
            }
        }
        require(targetBytes != null, "Minecraft Mixin target is missing: ${target}")
        require(inject.method.size() == 1 && readClass(targetBytes).methods.any {
            it.name == inject.method[0] && it.desc == descriptor
        }, "Mixin target signature changed: ${target}.${inject.method} ${descriptor}")
        report.get().asFile.parentFile.mkdirs()
        report.get().asFile.text = "Verified ${target}.${inject.method[0]}${descriptor}\n"
        logger.lifecycle(report.get().asFile.text.trim())
    }
}

tasks.register('verifyModJar') {
    group = 'verification'
    description = 'Validates the distributable Fabric JAR, metadata, license, and Mixin.'
    dependsOn tasks.named('jar')
    def modJar = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(modJar)
    inputs.property('modVersion', modVersion)
    inputs.property('minecraftVersion', minecraftVersion)
    inputs.property('loaderVersion', loaderVersion)
    def report = layout.buildDirectory.file('reports/verification/mod-jar.txt')
    outputs.file(report)
    doLast {
        new JarFile(modJar.get().asFile).withCloseable { jar ->
            def readJson = { String path ->
                require(jar.getJarEntry(path) != null, "Missing JAR resource: ${path}")
                jar.getInputStream(jar.getJarEntry(path)).withCloseable { new JsonSlurper().parse(it) }
            }
            def metadata = readJson('fabric.mod.json')
            require(metadata.schemaVersion == 1 && metadata.id == 'thirdpersonreadablemaps', 'Invalid Fabric mod identity')
            require(metadata.version == modVersion, 'Unexpanded or incorrect mod version')
            require(metadata.environment == 'client', 'The mod must remain client-only')
            require(metadata.depends.minecraft == ['26.1', '26.1.1', '26.1.2', '26.2'] && metadata.depends.java == '>=25', 'Incorrect Minecraft or Java requirements')
            require(metadata.depends.fabricloader == ">=${loaderVersion}", 'Unexpected minimum Fabric Loader version')
            require(metadata.license == 'MIT' && jar.getJarEntry('LICENSE') != null, 'MIT license is missing')
            require(metadata.mixins == ['thirdpersonreadablemaps.mixins.json'], 'Incorrect Mixin resource path')
            def config = readJson(metadata.mixins[0])
            require(config.required && config.compatibilityLevel == 'JAVA_25' && config.injectors.defaultRequire == 1, 'Mixin must be required on Java 25')
            require(config.package == 'tech.rolly.thirdpersonreadablemaps.mixin' && config.client == ['ReadableMapLayerMixin'], 'Incorrect client Mixin registration')
            require(jar.manifest.mainAttributes.getValue('Fabric-Mapping-Namespace') == 'official', 'Expected an official-namespace distributable JAR')
            require(jar.manifest.mainAttributes.getValue('Fabric-Minecraft-Version') == minecraftVersion, 'Wrong Minecraft build target')
            ['tech/rolly/thirdpersonreadablemaps/ReadableMapSurface.class', mixinClassPath].each { path ->
                require(jar.getJarEntry(path) != null, "Missing mod class: ${path}")
                require(readClass(jar.getInputStream(jar.getJarEntry(path)).bytes).version == Opcodes.V25, "Expected Java 25 bytecode: ${path}")
            }
            def mixin = readClass(jar.getInputStream(jar.getJarEntry(mixinClassPath)).bytes)
            def target = annotationValues(annotations(mixin).find { it.desc == 'Lorg/spongepowered/asm/mixin/Mixin;' }).value[0].internalName
            require(target == 'net/minecraft/client/renderer/entity/layers/ItemInHandLayer', 'Incorrect official-namespace Mixin target')
        }
        report.get().asFile.parentFile.mkdirs()
        report.get().asFile.text = "Verified distributable: ${modJar.get().asFile.name}\nMinecraft ${minecraftVersion}, Java 25, client-only, official namespace, MIT license, required Mixin\n"
        logger.lifecycle(report.get().asFile.text.trim())
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMixinTarget'), tasks.named('verifyModJar')
}
